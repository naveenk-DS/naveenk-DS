name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: naveenk-DS
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata

          # Wide two-column layout (like the sample you liked)
          config_display: large
          config_timezone: Asia/Kolkata

          # 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages (hide notebooks so Python/others show properly)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook, html, css

          # Commit habits (smaller sample to avoid the API error)
          plugin_habits: yes
          plugin_habits_charts: true
          plugin_habits_days: 14
          plugin_habits_from: 100

          # Lines added / removed
          plugin_lines: yes
          plugin_lines_history_limit: 1
