name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: naveenk-DS
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Kolkata

          # ---- Core (already working) ----
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook, html, css

          plugin_habits: yes
          plugin_habits_charts: true
          plugin_habits_days: 14
          plugin_habits_from: 100

          plugin_lines: yes
          plugin_lines_history_limit: 1

          # ---- STEP A (optional): tech icons ----
          # Remove the leading "# " on the 3 lines below after you add topics to your repos
          # plugin_topics: yes
          # plugin_topics_mode: mastered
          # plugin_topics_limit: 15

          # ---- STEP B (optional): PageSpeed rings ----
          # Needs a website + Google API key saved as secret PAGESPEED_TOKEN
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://YOUR-WEBSITE.com
          # plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

          # ---- STEP C (optional): Apple Music tracks ----
          # plugin_music: yes
          # plugin_music_provider: apple
          # plugin_music_mode: playlist
          # plugin_music_playlist: https://music.apple.com/YOUR-PLAYLIST-LINK
          # plugin_music_limit: 4

          # ---- STEP D (optional, untested): force dark background ----
          # extras_css: |
          #   body { background: #0d1117 !important; color: #c9d1d9 !important; }
